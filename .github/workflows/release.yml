name: Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Install Frontend Dependencies
        working-directory: ./client
        run: npm ci

      - name: Build Frontend
        working-directory: ./client
        run: npm run build

      - name: Copy Client Dist to Server Dist
        shell: pwsh
        run: |
          Remove-Item -Path "server/dist/assets/*" -Force -ErrorAction SilentlyContinue
          Copy-Item -Path "client/dist/*" -Destination "server/dist" -Recurse -Force

      - name: Build Windows Executables
        working-directory: ./server
        shell: pwsh
        run: |
          go build -ldflags="-H windowsgui -s -w" -o "../FreeToPlayer.exe" .
          go build -ldflags="-s -w" -o "../dj-server.exe" .

      - name: Create Release Zip Archive
        shell: pwsh
        run: |
          Compress-Archive -Path "FreeToPlayer.exe", "Запуск FreeToPlayer.bat", "sync_yandex_live.py", "sync_youtube_live.py", "README.md", "LICENSE" -DestinationPath "FreeToPlayer-${{ github.ref_name }}-windows-x64.zip"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            FreeToPlayer-${{ github.ref_name }}-windows-x64.zip
            FreeToPlayer.exe
          name: "FreeToPlayer Release ${{ github.ref_name }}"
          draft: false
          prerelease: false
          generate_release_notes: true
