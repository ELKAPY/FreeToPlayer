<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0e1e38" />
      <stop offset="50%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#04060a" />
    </radialGradient>

    <!-- Vinyl Sheen Gradient -->
    <linearGradient id="sheen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.15" />
      <stop offset="35%" stop-color="#ffffff" stop-opacity="0.02" />
      <stop offset="70%" stop-color="#22d3ee" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#0891b2" stop-opacity="0.4" />
    </linearGradient>

    <!-- Center Label Gradient -->
    <linearGradient id="centerLabel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Cyan Glow Filter -->
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Cover Background Canvas -->
  <rect width="500" height="500" rx="40" fill="url(#bgGrad)" />
  <rect width="496" height="496" x="2" y="2" rx="38" fill="none" stroke="#22d3ee" stroke-opacity="0.15" stroke-width="2" />

  <!-- Outer Vinyl Glow -->
  <circle cx="250" cy="250" r="200" fill="none" stroke="#22d3ee" stroke-opacity="0.2" stroke-width="6" filter="url(#cyanGlow)" />

  <!-- Vinyl Record Body -->
  <circle cx="250" cy="250" r="195" fill="#111622" stroke="#1e293b" stroke-width="4" />
  <circle cx="250" cy="250" r="195" fill="url(#sheen)" />

  <!-- Vinyl Grooves -->
  <circle cx="250" cy="250" r="172" fill="none" stroke="#334155" stroke-width="1.5" stroke-dasharray="14 10" opacity="0.6" />
  <circle cx="250" cy="250" r="150" fill="none" stroke="#334155" stroke-width="1.5" stroke-dasharray="18 12" opacity="0.5" />
  <circle cx="250" cy="250" r="128" fill="none" stroke="#334155" stroke-width="1.5" stroke-dasharray="12 8" opacity="0.4" />
  <circle cx="250" cy="250" r="106" fill="none" stroke="#334155" stroke-width="1.5" stroke-dasharray="16 10" opacity="0.4" />
  <circle cx="250" cy="250" r="84" fill="none" stroke="#334155" stroke-width="1" opacity="0.3" />

  <!-- Center Vinyl Label -->
  <circle cx="250" cy="250" r="72" fill="url(#centerLabel)" filter="url(#cyanGlow)" />
  <circle cx="250" cy="250" r="66" fill="#070a12" stroke="#22d3ee" stroke-width="2" />

  <!-- Center Spindle Hole -->
  <circle cx="250" cy="250" r="22" fill="#020408" stroke="#38bdf8" stroke-width="3" />

  <!-- DJ Equalizer Waveform in Center Label -->
  <path d="M 205 250 L 216 232 L 227 268 L 238 222 L 250 278 L 262 235 L 273 265 L 284 242 L 295 250" fill="none" stroke="#22d3ee" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Top / Bottom Hi-Fi Badge -->
  <text x="250" y="70" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="800" fill="#22d3ee" letter-spacing="4" opacity="0.9">DJ PLAYER HI-FI</text>
  <text x="250" y="445" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#94a3b8" letter-spacing="3" opacity="0.7">STUDIO MASTER AUDIO</text>
</svg>
