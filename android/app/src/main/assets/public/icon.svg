<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="discGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0891b2" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#07080c" stop-opacity="1" />
    </radialGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="112" fill="#07080c" />
  <circle cx="256" cy="256" r="230" fill="url(#discGlow)" />

  <!-- Outer Vinyl Rim -->
  <circle cx="256" cy="256" r="200" fill="#0f172a" stroke="#1e293b" stroke-width="6" />

  <!-- Grooves -->
  <circle cx="256" cy="256" r="175" fill="none" stroke="#334155" stroke-width="2" stroke-dasharray="8 6" opacity="0.6" />
  <circle cx="256" cy="256" r="150" fill="none" stroke="#334155" stroke-width="2" stroke-dasharray="12 8" opacity="0.5" />
  <circle cx="256" cy="256" r="125" fill="none" stroke="#334155" stroke-width="2" opacity="0.4" />

  <!-- Center Label -->
  <circle cx="256" cy="256" r="85" fill="url(#neonCyan)" />
  <circle cx="256" cy="256" r="28" fill="#07080c" stroke="#22d3ee" stroke-width="4" />

  <!-- Equalizer Pulse Wave on Label -->
  <path d="M 200 256 L 215 235 L 230 275 L 245 220 L 260 290 L 275 240 L 290 270 L 305 256" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
</svg>
